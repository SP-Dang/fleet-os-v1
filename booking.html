async function initCalendar(vehicleId) {
    try {
        const { data: rentals } = await client
            .from('rentals')
            .select('start_date, rental_days, status')
            .eq('vehicle_id', vehicleId);

        let disabledDates = [];

        (rentals || []).forEach(r => {
            if (r.status !== 'booked' && r.status !== 'active') return;

            let start = new Date(r.start_date);
            let end = new Date(start);
            end.setDate(start.getDate() + Number(r.rental_days || 0));

            disabledDates.push({ from: start, to: end });
        });

        flatpickr("#date-range", {
            mode: "range",
            minDate: "today",
            dateFormat: "Y-m-d",
            disable: disabledDates,

            onChange: function(dates) {
                if (dates.length === 2) {
                    selectedStart = dates[0];
                    selectedEnd = dates[1];
                }
            }
        });

    } catch (err) {
        console.error("Calendar error:", err);
    }
}


    
// ✅ LOAD VEHICLES

    async function loadVehicles() {
    try {

            .from('vehicles')
            .select('*');

            .from('rentals')
            .select('vehicle_id, start_date, rental_days, status');

            .from('vehicle_images')

            console.error("Vehicle Load Error:", vError);

        }

        if (imgError) {
            console.error("Image Load Error:", imgError);
        }

        const vehicleImages = images || [];

        const today = new Date();
        today.setHours(0,0,0,0);

        const list = document.getElementById('vehicle-list');
        if (!list) return;

        list.innerHTML = (vehicles || []).map(v => {

            // =========================================
            // 🔥 GET IMAGE (FIRST IMAGE)
            // =========================================
            const imgObj = vehicleImages.find(img =>
                String(img.vehicle_id) === String(v.id)
            );

            const imageUrl = imgObj?.image_url
                || 'https://via.placeholder.com/400x250?text=No+Image';

            // =========================================
            // ✅ CHECK IF CURRENTLY RENTED (TODAY)
            // =========================================
            const isRentedNow = (rentals || []).some(r => {
                if (String(r.vehicle_id) !== String(v.id)) return false;
                if (r.status !== 'booked' && r.status !== 'active') return false;

                const start = new Date(r.start_date);
                start.setHours(0,0,0,0);

                const end = new Date(start);
                end.setDate(start.getDate() + Number(r.rental_days || 0));

                return today >= start && today < end;
            });

            // =========================================
            // ✅ CHECK IF HAS FUTURE BOOKINGS
            // =========================================
            const hasFutureBooking = (rentals || []).some(r => {
                if (String(r.vehicle_id) !== String(v.id)) return false;
                if (r.status !== 'booked') return false;

                const start = new Date(r.start_date);
                start.setHours(0,0,0,0);

                return start > today;
            });

            // =========================================
            // 🎯 FINAL STATUS LOGIC
            // =========================================
            let badgeText = "Available";
            let badgeClass = "bg-green-100 text-green-600";
            let disabled = false;

            if (isRentedNow) {

                badgeClass = "bg-red-100 text-red-600";
                disabled = true;
            } else if (hasFutureBooking) {
                badgeText = "Booked";
                badgeClass = "bg-yellow-100 text-yellow-600";
                disabled = false;
            }

            return `
                <div class="bg-white rounded-2xl shadow relative overflow-hidden group hover:shadow-xl transition">

                    <!-- 🔥 IMAGE -->
                    <div class="h-[160px] w-full overflow-hidden">
                        <img src="${imageUrl}"

                        <!-- STATUS BADGE -->
                        <div class="absolute top-4 right-4 text-xs font-bold px-3 py-1 rounded-full ${badgeClass}">
                            ${badgeText}
                        </div>

                        <!-- VEHICLE NAME -->
                        <h3 class="text-xl font-black mb-1">${v.make_model}</h3>
                        <p class="text-slate-400 mb-3">${v.license_plate || ''}</p>

                        <!-- SPECS -->
                        <div class="grid grid-cols-2 gap-2 text-xs font-bold text-slate-600 mb-4">
                            <div>Seats: ${v.seats || '-'}</div>
                            <div>Type: ${v.vehicle_type || '-'}</div>
                            <div>Fuel: ${v.fuel_type || '-'}</div>
                            <div>Trans: ${v.transmission || '-'}</div>
                        </div>

                        <!-- PRICE -->
                        <p class="text-blue-600 font-bold mb-4">
                            ₭${Number(v.daily_rate || 0).toLocaleString()} / day

                        <!-- BUTTON -->

                    onclick='openModal(${JSON.stringify(v)})'

async function isVehicleAvailable(vehicleId, startDate, days) {
    const start = new Date(startDate);
    const end = new Date(start);
    end.setDate(end.getDate() + days);

    // get existing rentals
    const { data: rentals, error } = await client
        .from('rentals')
        .select('*')
        .eq('vehicle_id', vehicleId)
        .in('status', ['booked', 'active']);

    if (error) {
        console.error(error);
        return false;
    }

    for (const r of rentals) {
        const rStart = new Date(r.start_date);
        const rEnd = new Date(rStart);
        rEnd.setDate(rEnd.getDate() + Number(r.rental_days));

        // 🚨 OVERLAP CHECK
        if (start <= rEnd && end >= rStart) {
            return false; // NOT AVAILABLE
        }
    }

    return true; // AVAILABLE
}


async function checkAvailability(vehicleId, startDate, days) {
    try {
        const { data: rentals } = await client
            .from('rentals')
            .select('start_date, rental_days, status')
            .eq('vehicle_id', vehicleId);

        const start = new Date(startDate);
        start.setHours(0,0,0,0);

        const end = new Date(start);
        end.setDate(start.getDate() + Number(days));

        for (const r of (rentals || [])) {

            if (r.status !== 'booked' && r.status !== 'active') continue;

            const rStart = new Date(r.start_date);
            rStart.setHours(0,0,0,0);

            const rEnd = new Date(rStart);
            rEnd.setDate(rStart.getDate() + Number(r.rental_days || 0));

            // 🚨 OVERLAP CHECK
            const overlap = start < rEnd && end > rStart;

            if (overlap) {
                return false;
            }
        }

        return true;

    } catch (err) {
        console.error("Availability Check Error:", err);
        return false;
    }
}

// ✅ SAVE CUSTOMER + BOOKING
 async function saveCustomerAndBook() {
    try {
        // ✅ GET VALUES
        const name = document.getElementById('c-name').value.trim();
        const phone = document.getElementById('c-phone').value.trim();
        const email = document.getElementById('c-email').value.trim();
        const nationality = document.getElementById('c-nationality').value.trim();
        const passport = document.getElementById('c-passport').value.trim();
        const license = document.getElementById('c-license').value.trim();

        // ✅ USE CALENDAR VALUES
if (!selectedStart || !selectedEnd) {
    alert("Please select booking dates");
    return;
}

const start = selectedStart.getFullYear() + '-' +
    String(selectedStart.getMonth() + 1).padStart(2, '0') + '-' +
    String(selectedStart.getDate()).padStart(2, '0');


// calculate days automatically
const startDate = new Date(selectedStart);
const endDate = new Date(selectedEnd);

// normalize both to midnight
startDate.setHours(0,0,0,0);
endDate.setHours(0,0,0,0);

const diff = (endDate - startDate) / (1000 * 60 * 60 * 24);
const days = Math.max(1, Math.round(diff));

        // 🚨 VALIDATION
        if (!name) return alert("Full Name is required");
        if (!phone) return alert("Phone Number is required");
        if (!nationality) return alert("Nationality is required");
        if (!passport) return alert("Passport / ID is required");
        if (!license) return alert("Driving License is required");
        // =========================================
        // 🚨 STEP 1: CHECK AVAILABILITY (NEW SYSTEM)
        // =========================================
        const isAvailable = await checkAvailability(selectedVehicle, start, days);

        if (!isAvailable) {
            alert("❌ This vehicle is not available for selected dates");
            return;
        }
        // =========================================
        // 🚨 STEP 2: CHECK EXISTING CUSTOMER
        // =========================================
        let customerId = null;

        const { data: existingCustomer, error: findError } = await client
            .from('customers')
            .select('*')
            .eq('phone', phone)
            .maybeSingle(); // ✅ safer than .single()

        if (findError) {
            console.error(findError);
            alert("Customer lookup error");
            return;
        }

                await initCalendar(selectedVehicle);
            }

            // ✅ ALERT ONLY IF MODAL OPEN
            const modal = document.getElementById('booking-modal');
            if (modal && !modal.classList.contains('hidden')) {
                alert("⚠️ Availability updated. Please re-check dates.");
            }

        } catch (err) {
            console.error("Realtime booking error:", err);
        }
    })

    .subscribe();

    
</script>
