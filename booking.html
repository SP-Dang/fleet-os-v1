<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Booking</title>

    <!-- ✅ Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ✅ Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body class="bg-slate-50 p-6">

    <!-- HEADER -->
    <div class="max-w-6xl mx-auto mb-10">
        <h1 class="text-3xl font-black">🚗 Book Your Vehicle</h1>
        <p class="text-slate-500">Select a vehicle and choose your date</p>
    </div>

    <!-- VEHICLE GRID -->
    <div id="vehicle-list" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6"></div>

    <!-- BOOKING MODAL -->
    <div id="booking-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center">
        <div class="bg-white p-8 rounded-2xl w-96">

            <h2 class="text-xl font-black mb-4">Book Vehicle</h2>

            <input id="customer-name" placeholder="Your Name"
                class="w-full p-3 border rounded-xl mb-3">

            <input id="start-date" type="date"
                class="w-full p-3 border rounded-xl mb-3">

            <input id="days" type="number" placeholder="Days"
                class="w-full p-3 border rounded-xl mb-4">

            <button onclick="submitBooking()"
                class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">
                Confirm Booking
            </button>

            <button onclick="closeModal()"
                class="w-full mt-3 text-slate-400">
                Cancel
            </button>

        </div>
    </div>

    <!-- ✅ ALL LOGIC GOES HERE (IMPORTANT) -->
    <script>
        const client = supabase.createClient(
            'https://unaeguquzlvjmiebxsvg.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuYWVndXF1emx2am1pZWJ4c3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDk5MTAsImV4cCI6MjA5MTYyNTkxMH0.m6kCJus2-oHlzvmVxfFtbedKPbf8ricpQdIOQeB0fVg'
        );

        let selectedVehicle = null;

        // ✅ LOAD VEHICLES
        async function loadVehicles() {
            try {
                const { data } = await client
                    .from('vehicles')
                    .select('id, make_model, license_plate');

                const list = document.getElementById('vehicle-list');

                if (!data || data.length === 0) {
                    list.innerHTML = `<p class="text-slate-400">No vehicles available</p>`;
                    return;
                }

                list.innerHTML = data.map(v => `
                    <div class="bg-white p-6 rounded-2xl shadow">

                        <h3 class="text-xl font-black mb-2">
                            ${v.make_model}
                        </h3>

                        <p class="text-slate-400 mb-4">
                            ${v.license_plate || ''}
                        </p>

                        <button onclick="openModal('${v.id}')"
                            class="w-full bg-black text-white p-3 rounded-xl">
                            Book Now
                        </button>

                    </div>
                `).join('');

            } catch (err) {
                console.error("Load Vehicles Error:", err);
            }
        }

        // ✅ OPEN MODAL
        function openModal(id) {
            selectedVehicle = id;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        // ✅ CLOSE MODAL
        function closeModal() {
            document.getElementById('booking-modal').classList.add('hidden');
        }


    function isDateConflict(start, days, bookings) {
    const startDate = new Date(start);
    const endDate = new Date(start);
    endDate.setDate(startDate.getDate() + Number(days));

    return bookings.some(b => {
        const bStart = new Date(b.start_date);
        const bEnd = new Date(b.start_date);
        bEnd.setDate(bStart.getDate() + Number(b.rental_days));

        // 🔥 OVERLAP LOGIC
        return (startDate < bEnd && endDate > bStart);
    });
}

        
        // ✅ SUBMIT BOOKING
        async function submitBooking() {
    try {
        const name = document.getElementById('customer-name').value;
        const start = document.getElementById('start-date').value;
        const days = document.getElementById('days').value;

        if (!name || !start || !days) {
            alert("Please fill all fields");
            return;
        }

        // ✅ FETCH EXISTING BOOKINGS FOR THIS VEHICLE
        const { data: bookings } = await client
            .from('rentals')
            .select('start_date, rental_days')
            .eq('vehicle_id', selectedVehicle)
            .in('status', ['booked', 'active']);

        // ✅ CHECK CONFLICT
        const conflict = isDateConflict(start, days, bookings || []);

        if (conflict) {
            alert("❌ This vehicle is not available for selected dates");
            return;
        }

        // ✅ INSERT BOOKING
        await client.from('rentals').insert([{
            vehicle_id: selectedVehicle,
            customer_name: name,
            start_date: start,
            rental_days: Number(days),
            status: 'booked'
        }]);

        alert("✅ Booking successful!");

        closeModal();

    } catch (err) {
        console.error("Booking Error:", err);
        alert("Booking failed");
    }
}

        // ✅ AUTO LOAD (VERY IMPORTANT)
        loadVehicles();
    </script>

</body>
</html>
