<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

</head>

<body class="bg-slate-50 p-6">

<!-- HEADER -->
<div class="max-w-6xl mx-auto mb-10">
    <h1 class="text-3xl font-black">🚗 Book Your Vehicle</h1>
    <p class="text-slate-500">Select a vehicle and choose your date</p>
</div>

<!-- ✅ GLOBAL SUCCESS MESSAGE (VISIBLE AFTER BOOKING) -->
<div id="success-msg" 
     class="hidden max-w-6xl mx-auto mb-6 p-4 bg-green-100 text-green-700 font-bold rounded-xl text-center">
</div>

<!-- VEHICLE GRID -->
<div id="vehicle-list" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6"></div>

<!-- BOOKING MODAL -->
<div id="booking-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center">
    <div class="bg-white p-8 rounded-2xl w-96">

        <h2 class="text-xl font-black mb-4">Book Vehicle</h2>

        <!-- ✅ DATE RANGE (NEW) -->
        <input id="date-range"
            placeholder="Select booking dates"
            class="w-full p-3 border rounded-xl mb-4">

        <!-- NEXT BUTTON -->
        <button onclick="openCustomerModal()"
            class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">
            Next
        </button>

        <!-- CANCEL BUTTON -->
        <button onclick="closeModal()"
            class="w-full mt-3 text-slate-400">
            Cancel
        </button>

    </div>
</div>

    
<!-- ✅ CUSTOMER MODAL -->
<div id="customer-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center">
    <div class="bg-white p-8 rounded-2xl w-[400px]">

        <h2 class="text-xl font-black mb-4">Register Customer</h2>

        <input id="c-name" placeholder="Full Name"
            class="w-full p-3 border rounded-xl mb-3">

        <input id="c-phone" placeholder="Phone"
            class="w-full p-3 border rounded-xl mb-3">

        <input id="c-email" placeholder="Email"
            class="w-full p-3 border rounded-xl mb-3">

        <input id="c-nationality" placeholder="Nationality"
            class="w-full p-3 border rounded-xl mb-3">

        <input id="c-passport" placeholder="Passport / ID"
            class="w-full p-3 border rounded-xl mb-3">

        <input id="c-license" placeholder="License No"
            class="w-full p-3 border rounded-xl mb-4">

        <button onclick="saveCustomerAndBook()"
            class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">
            Save & Book
        </button>

        <button onclick="closeCustomerModal()"
            class="w-full mt-3 text-slate-400">
            Cancel
        </button>

    </div>
</div>

<!-- SCRIPT -->
<script>
const client = supabase.createClient(
    'https://unaeguquzlvjmiebxsvg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuYWVndXF1emx2am1pZWJ4c3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDk5MTAsImV4cCI6MjA5MTYyNTkxMH0.m6kCJus2-oHlzvmVxfFtbedKPbf8ricpQdIOQeB0fVg'
);

let selectedVehicle = null;
let selectedVehicleData = null;

// ✅ LOAD VEHICLES

    async function loadVehicles() {
    try {
        const { data: vehicles, error: vError } = await client
            .from('vehicles')
            .select('*');

        const { data: rentals } = await client
            .from('rentals')
            .select('vehicle_id, start_date, rental_days, status');

        if (vError) {
            console.error("Vehicle Load Error:", vError);
            return;
        }

        const today = new Date();
        today.setHours(0,0,0,0);

        const list = document.getElementById('vehicle-list');
        if (!list) return;

        list.innerHTML = (vehicles || []).map(v => {

            // ✅ CHECK AVAILABILITY
            const isUnavailable = (rentals || []).some(r => {
                if (String(r.vehicle_id) !== String(v.id)) return false;

                const start = new Date(r.start_date);
                start.setHours(0,0,0,0);

                const end = new Date(start);
                end.setDate(start.getDate() + Number(r.rental_days || 0));

                return today <= end && (r.status === 'booked' || r.status === 'active');
            });

            return `
                <div class="bg-white p-6 rounded-2xl shadow relative">

                    <!-- STATUS BADGE -->
                    <div class="absolute top-4 right-4 text-xs font-bold px-3 py-1 rounded-full
                        ${isUnavailable 
                            ? 'bg-red-100 text-red-600' 
                            : 'bg-green-100 text-green-600'}">
                        ${isUnavailable ? 'Booked' : 'Available'}
                    </div>

                    <!-- VEHICLE NAME -->
                    <h3 class="text-xl font-black mb-1">${v.make_model}</h3>
                    <p class="text-slate-400 mb-3">${v.license_plate || ''}</p>

                    <!-- ✅ VEHICLE SPECS (FIXED COLUMN NAMES) -->
                    <div class="grid grid-cols-2 gap-2 text-xs font-bold text-slate-600 mb-4">

                        <div>Seats: ${v.seats || '-'}</div>
                        <div>Type: ${v.vehicle_type || '-'}</div>

                        <div>Fuel: ${v.fuel_type || '-'}</div>
                        <div>Trans: ${v.transmission || '-'}</div>

                    </div>

                    <!-- PRICE -->
                    <p class="text-blue-600 font-bold mb-4">
                        ₭${Number(v.daily_rate || 0).toLocaleString()} / day
                    </p>

                    <!-- BUTTON -->
                    <button 
                        ${isUnavailable ? 'disabled' : ''}
                        onclick='openModal(${JSON.stringify(v)})'
                        class="w-full p-3 rounded-xl font-bold
                            ${isUnavailable 
                                ? 'bg-gray-300 text-gray-500 cursor-not-allowed' 
                                : 'bg-black text-white hover:bg-blue-600'}">
                        ${isUnavailable ? 'Unavailable' : 'Book Now'}
                    </button>

                </div>
            `;
        }).join('');

    } catch (err) {
        console.error("Load Vehicles Error:", err);
    }
}


// ✅ OPEN BOOKING MODAL
function openModal(vehicle) {
    selectedVehicle = vehicle.id;
    selectedVehicleData = vehicle;
    document.getElementById('booking-modal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('booking-modal').classList.add('hidden');
}

// ✅ CUSTOMER MODAL
function openCustomerModal() {
    const start = document.getElementById('start-date').value;
    const days = document.getElementById('days').value;

    if (!start || !days) {
        alert("Please fill booking details first");
        return;
    }

    document.getElementById('customer-modal').classList.remove('hidden');
}

function closeCustomerModal() {
    document.getElementById('customer-modal').classList.add('hidden');
}


async function isVehicleAvailable(vehicleId, startDate, days) {
    const start = new Date(startDate);
    const end = new Date(start);
    end.setDate(end.getDate() + days);

    // get existing rentals
    const { data: rentals, error } = await client
        .from('rentals')
        .select('*')
        .eq('vehicle_id', vehicleId)
        .in('status', ['booked', 'active']);

    if (error) {
        console.error(error);
        return false;
    }

    for (const r of rentals) {
        const rStart = new Date(r.start_date);
        const rEnd = new Date(rStart);
        rEnd.setDate(rEnd.getDate() + Number(r.rental_days));

        // 🚨 OVERLAP CHECK
        if (start <= rEnd && end >= rStart) {
            return false; // NOT AVAILABLE
        }
    }

    return true; // AVAILABLE
}


async function checkAvailability(vehicleId, startDate, days) {
    try {
        const { data: rentals } = await client
            .from('rentals')
            .select('start_date, rental_days, status')
            .eq('vehicle_id', vehicleId);

        const start = new Date(startDate);
        start.setHours(0,0,0,0);

        const end = new Date(start);
        end.setDate(start.getDate() + Number(days));

        for (const r of (rentals || [])) {

            if (r.status !== 'booked' && r.status !== 'active') continue;

            const rStart = new Date(r.start_date);
            rStart.setHours(0,0,0,0);

            const rEnd = new Date(rStart);
            rEnd.setDate(rStart.getDate() + Number(r.rental_days || 0));

            // 🚨 OVERLAP CHECK
            const overlap = start < rEnd && end > rStart;

            if (overlap) {
                return false;
            }
        }

        return true;

    } catch (err) {
        console.error("Availability Check Error:", err);
        return false;
    }
}


    
// ✅ SAVE CUSTOMER + BOOKING

 async function saveCustomerAndBook() {
    try {
        // ✅ GET VALUES
        const name = document.getElementById('c-name').value.trim();
        const phone = document.getElementById('c-phone').value.trim();
        const email = document.getElementById('c-email').value.trim();
        const nationality = document.getElementById('c-nationality').value.trim();
        const passport = document.getElementById('c-passport').value.trim();
        const license = document.getElementById('c-license').value.trim();

        const start = document.getElementById('start-date').value;
        const days = Number(document.getElementById('days').value);

        // 🚨 VALIDATION
        if (!name) return alert("Full Name is required");
        if (!phone) return alert("Phone Number is required");
        if (!nationality) return alert("Nationality is required");
        if (!passport) return alert("Passport / ID is required");
        if (!license) return alert("Driving License is required");
        if (!start || !days) return alert("Booking date and duration required");

        // =========================================
        // 🚨 STEP 1: CHECK AVAILABILITY (NEW SYSTEM)
        // =========================================
        const isAvailable = await checkAvailability(selectedVehicle, start, days);

        if (!isAvailable) {
            alert("❌ This vehicle is not available for selected dates");
            return;
        }

        // =========================================
        // 🚨 STEP 2: CHECK EXISTING CUSTOMER
        // =========================================
        let customerId = null;

        const { data: existingCustomer, error: findError } = await client
            .from('customers')
            .select('*')
            .eq('phone', phone)
            .maybeSingle(); // ✅ safer than .single()

        if (findError) {
            console.error(findError);
            alert("Customer lookup error");
            return;
        }

        if (existingCustomer) {
            // ✅ reuse existing customer
            customerId = existingCustomer.id;
        } else {
            // ✅ create new customer
            const { data: newCustomer, error: cError } = await client
                .from('customers')
                .insert([{
                    full_name: name,
                    phone: phone,
                    email: email || null,
                    nationality: nationality,
                    passport_number: passport,
                    license_number: license
                }])
                .select()
                .single();

            if (cError) {
                console.error("Customer Error:", cError);
                alert("❌ Customer error: " + cError.message);
                return;
            }

            customerId = newCustomer.id;
        }

        // =========================================
        // 🚨 STEP 3: CREATE RENTAL
        // =========================================
        const { error: rError } = await client
            .from('rentals')
            .insert([{
                vehicle_id: selectedVehicle,
                customer_id: customerId,
                start_date: start,
                rental_days: days,
                total_price: days * (selectedVehicleData?.daily_rate || 0),
                status: 'booked'
            }]);

        if (rError) {
            console.error("Rental Error:", rError);
            alert("❌ Booking error: " + rError.message);
            return;
        }

        // =========================================
        // ✅ SUCCESS MESSAGE (VISIBLE)
        // =========================================
        const msg = document.getElementById('success-msg');

        if (msg) {
            msg.innerText = "🎉 Booking confirmed successfully!";
            msg.classList.remove('hidden');

            setTimeout(() => {
                msg.classList.add('hidden');
            }, 4000);
        }


// ✅ CLEAR CUSTOMER FORM
document.getElementById('c-name').value = '';
document.getElementById('c-phone').value = '';
document.getElementById('c-email').value = '';
document.getElementById('c-nationality').value = '';
document.getElementById('c-passport').value = '';
document.getElementById('c-license').value = '';

// ✅ CLEAR BOOKING FORM
document.getElementById('start-date').value = '';
document.getElementById('days').value = '';

// ✅ CLOSE MODALS (SAFE)
if (typeof closeCustomerModal === 'function') closeCustomerModal();
if (typeof closeModal === 'function') closeModal();

// ✅ REFRESH VEHICLE LIST (IMPORTANT)
if (typeof loadVehicles === 'function') {
    loadVehicles();
}

} catch (err) {
    console.error("System Error:", err);
    alert("System error occurred");
}
}


// ✅ SAFE AUTO LOAD
window.onload = function () {
    loadVehicles();
};

    
</script>

</body>
</html>
