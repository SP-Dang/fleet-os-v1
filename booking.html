<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body class="bg-slate-50 p-6">
<div class="max-w-6xl mx-auto mb-12">
<div class="flex items-center gap-4 mb-4">
<div class="w-14 h-14 rounded-full overflow-hidden border border-slate-200 shadow-sm">
<img src="logo.png" alt="Logo" class="w-full h-full object-cover">
</div>
<div>
<h1 class="text-3xl md:text-4xl font-black tracking-tight leading-none">
<span class="text-slate-900">TATA SMILE CAR RENTAL</span>
<span class="text-blue-600"> - BOOK YOUR VEHICLE</span>
</h1>
<div class="flex items-center gap-2 mt-1">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
<span class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Instant Booking Available</span>
</div>
</div>
</div>
<div class="flex justify-between items-center flex-wrap gap-2">
<p class="text-slate-500 font-semibold text-sm tracking-wide">Select your preferred vehicle and choose your rental dates.</p>
<p class="font-medium text-[11px] tracking-wide whitespace-nowrap">
<span class="text-slate-500">Powered by</span>
<span class="text-blue-600"> Somphone · 020 5534 8882</span>
</p>
</div>
</div>
<div id="success-msg" class="hidden max-w-6xl mx-auto mb-6 p-4 bg-green-100 text-green-700 font-bold rounded-xl text-center"></div>
<div id="vehicle-list" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6"></div>
<div id="booking-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center transition-opacity duration-300 opacity-0">
<div id="modal-card" class="bg-white rounded-2xl w-[500px] max-h-[90vh] overflow-hidden transform scale-95 opacity-0 transition-all duration-300 shadow-2xl">
<div class="relative">
<img id="vehicle-image" class="w-full h-72 object-cover">
<button onclick="prevImage()" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/50 text-white px-3 py-1 rounded-full">‹</button>
<button onclick="nextImage()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/50 text-white px-3 py-1 rounded-full">›</button>
</div>
<div class="p-6">
<div class="flex justify-between items-center mb-3">
<h3 id="vehicle-name" class="text-xl font-bold text-slate-800"></h3>
<p id="vehicle-price" class="text-blue-600 font-bold"></p>
</div>
<h2 class="text-lg font-black mb-3">Select Dates</h2>
<input id="date-range" placeholder="Select booking dates" class="w-full p-3 border rounded-xl mb-4">
<button onclick="openCustomerModal()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition">Next</button>
<button onclick="closeModal()" class="w-full mt-3 text-slate-400 hover:text-slate-600">Cancel</button>
</div>
</div>
</div>
<div id="customer-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center">
<div class="bg-white p-8 rounded-2xl w-[400px]">
<h2 class="text-xl font-black mb-4">Register Customer</h2>
<input id="c-name" placeholder="Full Name" class="w-full p-3 border rounded-xl mb-3">
<input id="c-phone" placeholder="Phone" class="w-full p-3 border rounded-xl mb-3">
<input id="c-email" placeholder="Email" class="w-full p-3 border rounded-xl mb-3">
<input id="c-nationality" placeholder="Nationality" class="w-full p-3 border rounded-xl mb-3">
<input id="c-passport" placeholder="Passport / ID" class="w-full p-3 border rounded-xl mb-3">
<input id="c-license" placeholder="License No" class="w-full p-3 border rounded-xl mb-4">
<button onclick="saveCustomerAndBook()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Save & Book</button>
<button onclick="closeCustomerModal()" class="w-full mt-3 text-slate-400">Cancel</button>
</div>
</div>
<div id="whatsapp-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
<div class="bg-white rounded-3xl p-8 w-[400px] text-center shadow-xl">
<h2 class="text-xl font-black mb-4">Booking Confirmed 🎉</h2>
<p class="text-slate-500 mb-6 text-sm">Would you like to contact us via WhatsApp to confirm your booking?</p>
<div class="flex gap-3 justify-center">
<button onclick="openWhatsAppInvoice(window.latestBooking);closeWhatsAppModal();" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-2xl font-black text-sm shadow-md">Yes, Contact</button>
<button onclick="closeWhatsAppModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-6 py-3 rounded-2xl font-black text-sm">Maybe Later</button>
</div>
</div>
</div>
