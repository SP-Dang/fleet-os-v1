<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet OS | POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white antialiased">
    <div class="max-w-6xl mx-auto p-6">
        <header class="flex justify-between items-center border-b border-slate-700 pb-6 mb-8">
            <h1 class="text-2xl font-bold tracking-tight">🚀 FLEET OS <span class="text-blue-400 text-sm font-normal">v1.0</span></h1>
            <div id="connection-status" class="px-3 py-1 rounded-full text-xs bg-slate-800 text-slate-400">
                Checking connection...
            </div>
        </header>

        <main>
            <h2 class="text-xl font-semibold mb-4">Vehicle Inventory</h2>
            <div id="vehicle-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="animate-pulse bg-slate-800 h-32 rounded-lg"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
