<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet OS | Modern Rental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap');
        body { font-family: 'Noto Sans Lao', sans-serif; transition: all 0.3s; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); align-items: center; justify-content: center; z-index: 50; padding: 20px; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .view-content.hidden { display: none; }
        input::placeholder { color: #cbd5e1; font-weight: 400; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900">

    <div class="max-w-6xl mx-auto p-6">
        <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-[32px] shadow-sm border border-slate-100">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-slate-900 rounded-2xl flex items-center justify-center text-white text-xl">🚀</div>
                <div>
                    <h1 class="text-xl font-black tracking-tighter">FLEET<span class="text-blue-600">OS</span></h1>
                    <div id="db-status" class="flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                        <span class="text-[9px] font-black uppercase text-slate-400">System Offline</span>
                    </div>
                </div>
            </div>
            <nav class="flex bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                <button onclick="switchView('dashboard')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all hover:bg-white">Fleet</button>
                <button onclick="switchView('rentals')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all hover:bg-white">Active Loans</button>
            </nav>
        </header>

        <div id="view-dashboard" class="view-content">
            <div id="vehicle-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full py-20 text-center text-slate-300 font-black italic uppercase tracking-widest">Initialising Database...</div>
            </div>
        </div>

        <div id="view-rentals" class="view-content hidden">
            <div class="bg-white rounded-[40px] border border-slate-100 overflow-hidden shadow-sm">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-100 text-[10px] font-black uppercase text-slate-400">
                        <tr><th class="p-8">Vehicle</th><th class="p-8">Customer</th><th class="p-8">Duration</th><th class="p-8">Revenue</th></tr>
                    </thead>
                    <tbody id="rental-list" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="booking-modal" class="modal">
        <div class="bg-white w-full max-w-lg rounded-[48px] shadow-2xl overflow-hidden relative border border-white/20">
            
            <div class="bg-slate-900 p-8 text-white">
                <h2 id="m-title" class="text-3xl font-black italic uppercase leading-none mb-2">Vehicle Name</h2>
                <div class="flex justify-between items-center">
                    <span id="m-rate" class="text-blue-400 font-bold text-sm">Rate: $0.00/day</span>
                    <span id="m-plate" class="text-[10px] font-black text-slate-500 uppercase tracking-widest">PLATE-000</span>
                </div>
            </div>

            <div class="p-8">
                <div id="step-customer">
                    <label class="text-[10px] font-black uppercase text-slate-400 mb-4 block">1. Select or Add Customer</label>
                    <select id="cust-select" class="w-full bg-slate-50 p-5 rounded-3xl font-bold outline-none border border-slate-100 mb-3 appearance-none">
                        <option value="">-- Choose Existing Customer --</option>
                    </select>
                    <button onclick="toggleNewCustomer()" class="text-blue-600 font-black text-[10px] uppercase ml-4">+ Register New Customer</button>

                    <div id="new-cust-form" class="hidden mt-4 space-y-2 bg-slate-50 p-6 rounded-[32px] border border-slate-100">
                        <input id="c-name" type="text" placeholder="Full Name" class="w-full bg-white p-4 rounded-xl text-sm font-bold border border-slate-200 outline-none focus:border-blue-500">
                        <input id="c-phone" type="text" placeholder="Phone Number" class="w-full bg-white p-4 rounded-xl text-sm font-bold border border-slate-200 outline-none focus:border-blue-500">
                        <input id="c-passport" type="text" placeholder="Passport No." class="w-full bg-white p-4 rounded-xl text-sm font-bold border border-slate-200 outline-none focus:border-blue-500">
                        <button onclick="quickRegister()" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl text-[10px] uppercase">Save & Use</button>
                    </div>
                </div>

                <div class="mt-8">
                    <label class="text-[10px] font-black uppercase text-slate-400 mb-4 block">2. Rental Duration</label>
                    <div class="flex items-center justify-between bg-slate-50 p-4 rounded-[32px] border border-slate-100">
                        <button onclick="adjustDays(-1)" class="w-14 h-14 bg-white shadow-sm rounded-2xl flex items-center justify-center font-black text-xl hover:bg-slate-900 hover:text-white transition-all">-</button>
                        <div class="text-center">
                            <input id="rental-days" type="number" value="1" min="1" oninput="updateTotal()" class="bg-transparent text-center text-4xl font-black w-24 outline-none">
                            <p class="text-[9px] font-black uppercase text-slate-300">Days</p>
                        </div>
                        <button onclick="adjustDays(1)" class="w-14 h-14 bg-white shadow-sm rounded-2xl flex items-center justify-center font-black text-xl hover:bg-slate-900 hover:text-white transition-all">+</button>
                    </div>
                </div>

                <div class="mt-10 pt-8 border-t border-dashed border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase">Total Payment</p>
                        <h3 id="m-total" class="text-3xl font-black text-slate-900">$0.00</h3>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="closeModal()" class="px-6 py-4 rounded-2xl font-black text-slate-400 uppercase text-[10px]">Cancel</button>
                        <button onclick="confirmBooking()" class="px-8 py-4 bg-slate-900 text-white rounded-2xl font-black uppercase text-[10px] shadow-xl hover:bg-blue-600 transition-all">Confirm Rental</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const client = window.supabase.createClient('https://unaeguquzlvjmiebxsvg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuYWVndXF1emx2am1pZWJ4c3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDk5MTAsImV4cCI6MjA5MTYyNTkxMH0.m6kCJus2-oHlzvmVxfFtbedKPbf8ricpQdIOQeB0fVg');

        let activeV = null;
        let customers = [];

        async function init() {
            await loadVehicles();
            await loadCustomers();
        }

        function switchView(v) {
            document.querySelectorAll('.view-content').forEach(e => e.classList.add('hidden'));
            document.getElementById('view-' + v).classList.remove('hidden');
            if(v === 'rentals') loadRentals();
        }

        async function loadVehicles() {
            const { data, error } = await client.from('vehicles').select('*');
            const grid = document.getElementById('vehicle-grid');
            const status = document.getElementById('db-status');
            
            if(error) return status.innerHTML = `<span class='text-red-500'>Error</span>`;
            
            status.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-green-500"></span><span class="text-[9px] font-black uppercase text-slate-400">System Online</span>`;
            
            grid.innerHTML = data.map(v => `
                <div class="bg-white p-8 rounded-[48px] border border-slate-100 shadow-sm hover:shadow-2xl transition-all group">
                    <div class="flex justify-between items-start mb-6">
                        <span class="px-3 py-1 bg-slate-50 border border-slate-100 rounded-full text-[8px] font-black text-slate-400 uppercase">${v.license_plate}</span>
                        <span class="text-blue-600 font-black text-xs">$${v.daily_rate}/day</span>
                    </div>
                    <h3 class="text-2xl font-black italic uppercase leading-tight mb-8 group-hover:text-blue-600 transition-all">${v.make_model}</h3>
                    <div class="flex gap-2 mb-8">
                        <span class="px-3 py-1 bg-slate-50 rounded-lg text-[9px] font-bold text-slate-400">${v.transmission}</span>
                        <span class="px-3 py-1 bg-slate-50 rounded-lg text-[9px] font-bold text-slate-400">${v.fuel_type}</span>
                    </div>
                    <button onclick='openBooking(${JSON.stringify(v)})' class="w-full py-5 bg-slate-900 text-white rounded-3xl font-black text-[10px] uppercase tracking-widest hover:scale-[1.02] active:scale-95 transition-all shadow-lg">Select & Book</button>
                </div>
            `).join('');
        }

        async function loadCustomers() {
            const { data } = await client.from('customers').select('*');
            customers = data || [];
            const select = document.getElementById('cust-select');
            select.innerHTML = '<option value="">-- Choose Existing Customer --</option>' + 
                customers.map(c => `<option value="${c.id}">${c.full_name} (${c.phone})</option>`).join('');
        }

        function toggleNewCustomer() {
            document.getElementById('new-cust-form').classList.toggle('hidden');
        }

        async function quickRegister() {
            const name = document.getElementById('c-name').value;
            const phone = document.getElementById('c-phone').value;
            const pass = document.getElementById('c-passport').value;
            if(!name || !phone) return alert("Missing info");

            const { data, error } = await client.from('customers').insert([{ full_name: name, phone: phone, passport_number: pass }]).select().single();
            if(error) return alert(error.message);

            await loadCustomers();
            document.getElementById('cust-select').value = data.id;
            toggleNewCustomer();
            alert("Registered Successfully!");
        }

        function openBooking(v) {
            activeV = v;
            document.getElementById('m-title').innerText = v.make_model;
            document.getElementById('m-rate').innerText = `Rate: $${v.daily_rate}/day`;
            document.getElementById('m-plate').innerText = v.license_plate;
            document.getElementById('rental-days').value = 1;
            updateTotal();
            document.getElementById('booking-modal').classList.add('active');
        }

        function adjustDays(n) {
            let el = document.getElementById('rental-days');
            let val = parseInt(el.value) + n;
            if(val < 1) val = 1;
            el.value = val;
            updateTotal();
        }

        function updateTotal() {
            const days = document.getElementById('rental-days').value;
            document.getElementById('m-total').innerText = `$${(days * activeV.daily_rate).toFixed(2)}`;
        }

        function closeModal() { document.getElementById('booking-modal').classList.remove('active'); }

        async function confirmBooking() {
            const custId = document.getElementById('cust-select').value;
            const days = document.getElementById('rental-days').value;
            if(!custId) return alert("Select a customer first!");

            const { error } = await client.from('rentals').insert([{
                vehicle_id: activeV.id, customer_id: custId, start_date: new Date().toISOString(), rental_days: parseInt(days), status: 'active'
            }]);

            if(error) return alert(error.message);
            alert("Booking Confirmed!");
            closeModal();
            loadVehicles();
        }

        async function loadRentals() {
            const { data } = await client.from('rentals').select('*, vehicles(make_model, daily_rate), customers(full_name)');
            document.getElementById('rental-list').innerHTML = (data || []).map(r => `
                <tr>
                    <td class="p-8 font-black uppercase italic text-sm">${r.vehicles?.make_model}</td>
                    <td class="p-8 text-slate-500 font-bold">${r.customers?.full_name}</td>
                    <td class="p-8 font-black text-[10px] text-slate-400 uppercase">${r.rental_days} Days</td>
                    <td class="p-8 font-black text-blue-600">$${(r.rental_days * r.vehicles?.daily_rate).toFixed(2)}</td>
                </tr>
            `).join('');
        }

        window.onload = init;
    </script>
</body>
</html>
