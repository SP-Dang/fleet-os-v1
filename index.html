<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet OS | Professional Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf-autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap');
        body { font-family: 'Noto Sans Lao', sans-serif; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); align-items: center; justify-content: center; z-index: 50; padding: 20px; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .view-content.hidden { display: none; }
        .day-cell { min-width: 45px; height: 45px; border: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; flex-shrink: 0; }
        .rented-cell { background: #3b82f6; color: white; border-radius: 4px; border: 2px solid #fff; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900">

    <div class="max-w-7xl mx-auto p-6">
        <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-[32px] shadow-sm border border-slate-100">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-slate-900 rounded-2xl flex items-center justify-center text-white text-xl">🚀</div>
                <div>
                    <h1 class="text-xl font-black tracking-tighter uppercase">Fleet<span class="text-blue-600">OS</span></h1>
                    <div class="flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                        <span class="text-[9px] font-black uppercase text-slate-400">System Online</span>
                    </div>
                </div>
            </div>
            <nav class="flex bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                <button onclick="switchView('dashboard')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all hover:bg-white">Fleet</button>
                <button onclick="switchView('rentals')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all hover:bg-white">Rent History</button>
                <button onclick="switchView('schedule')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all hover:bg-white">14-Day Grid</button>
            </nav>
        </header>

        <div id="view-dashboard" class="view-content">
            <div class="flex flex-col md:flex-row gap-4 mb-10">
                <div class="flex-1 relative group">
                    <input type="text" id="search-input" oninput="filterVehicles()" placeholder="Search vehicle model or plate..." class="w-full bg-white border border-slate-100 p-6 pl-14 rounded-[32px] font-bold outline-none focus:ring-4 focus:ring-blue-50 transition-all shadow-sm">
                    <span class="absolute left-6 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-blue-500 transition-colors">🔍</span>
                </div>
            </div>
            <div id="vehicle-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="view-rentals" class="view-content hidden">
            <div class="bg-white rounded-[40px] border border-slate-100 overflow-hidden shadow-sm">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-100 text-[10px] font-black uppercase text-slate-400">
                        <tr>
                            <th class="p-8">Vehicle</th>
                            <th class="p-8">Customer</th>
                            <th class="p-8">Duration</th>
                            <th class="p-8">Status</th>
                            <th class="p-8 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rental-list" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>

        <div id="view-schedule" class="view-content hidden">
            <div class="bg-white rounded-[40px] border border-slate-100 p-8 shadow-sm">
                <h2 class="text-xl font-black mb-6 uppercase italic">Availability Timeline</h2>
                <div id="timeline-container" class="overflow-x-auto pb-4"></div>
            </div>
        </div>
    </div>

    <div id="booking-modal" class="modal">
        <div class="bg-white w-full max-w-lg rounded-[48px] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 p-8 text-white">
                <h2 id="b-title" class="text-3xl font-black uppercase italic tracking-tighter">Confirm Booking</h2>
                <p id="b-subtitle" class="text-blue-400 font-black text-[10px] uppercase tracking-widest"></p>
            </div>
            <div class="p-8 space-y-6 overflow-y-auto">
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block tracking-widest">1. Customer Selection</label>
                    <div class="flex gap-2">
                        <select id="b-customer" class="flex-1 bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none focus:ring-2 ring-blue-500/20 transition-all"></select>
                        <button onclick="toggleNewCust()" class="px-5 bg-blue-600 text-white rounded-2xl font-black text-xl hover:bg-slate-900 transition-all">+</button>
                    </div>
                </div>

                <div id="new-cust-box" class="hidden bg-blue-50 p-6 rounded-[32px] border border-blue-100 space-y-3">
                    <p class="text-[10px] font-black uppercase text-blue-600">Register New Customer</p>
                    <input id="nc-name" type="text" placeholder="Full Name" class="w-full p-4 rounded-xl border border-slate-200 font-bold text-sm outline-none">
                    <input id="nc-phone" type="text" placeholder="Phone Number" class="w-full p-4 rounded-xl border border-slate-200 font-bold text-sm outline-none">
                    <button onclick="saveNewCustomer()" class="w-full py-4 bg-slate-900 text-white rounded-xl font-black text-[10px] uppercase tracking-widest">Register & Select</button>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block tracking-widest">2. Booking Date</label>
                    <input id="b-start-date" type="date" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none focus:ring-2 ring-blue-500/20">
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block tracking-widest">3. Rental Duration (Days)</label>
                    <input id="b-days" type="number" value="1" min="1" oninput="updateBookingTotal()" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none focus:ring-2 ring-blue-500/20">
                </div>

                <div class="bg-slate-900 p-6 rounded-[32px] flex justify-between items-center text-white">
                    <span class="text-[10px] font-black uppercase opacity-60">Grand Total</span>
                    <span id="b-total" class="text-2xl font-black">$0</span>
                </div>
            </div>
            <div class="p-8 bg-slate-50 flex gap-4">
                <button onclick="closeModal('booking-modal')" class="flex-1 py-4 font-black uppercase text-[10px] text-slate-400 hover:text-slate-900 transition-colors">Cancel</button>
                <button onclick="confirmRental()" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-[10px] shadow-lg hover:shadow-blue-200 transition-all">Confirm Rental</button>
            </div>
        </div>
    </div>

    <div id="repair-modal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[48px] shadow-2xl overflow-hidden flex flex-col">
            <div class="bg-amber-500 p-8 text-white"><h2 class="text-2xl font-black uppercase italic">Repair Summary</h2></div>
            <div class="p-8 space-y-4">
                <textarea id="r-description" placeholder="Description of work..." class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none h-24"></textarea>
                <div class="grid grid-cols-2 gap-4">
                    <input id="r-mileage" type="number" placeholder="Mileage" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
                    <input id="r-cost" type="number" placeholder="Cost ($)" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
                </div>
            </div>
            <div class="p-8 bg-slate-50 flex gap-3">
                <button onclick="closeModal('repair-modal')" class="flex-1 py-4 font-black uppercase text-[10px]">Cancel</button>
                <button onclick="submitRepairLog()" class="flex-[2] py-4 bg-slate-900 text-white rounded-2xl font-black uppercase text-[10px]">Complete Repair</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[48px] shadow-2xl overflow-hidden relative flex flex-col">
            <div class="bg-blue-600 p-8 text-white"><h2 class="text-2xl font-black uppercase italic tracking-tighter">Edit Vehicle</h2></div>
            <div class="p-8 space-y-4 overflow-y-auto max-h-[60vh]">
                <input id="e-model" type="text" placeholder="Make & Model" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
                <input id="e-plate" type="text" placeholder="License Plate" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input id="e-rate" type="number" placeholder="Daily Rate ($)" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
                    <input id="e-seats" type="number" placeholder="Seats" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
                </div>
                <select id="e-fuel" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
                    <option value="Diesel">Diesel</option><option value="Gasoline">Gasoline</option><option value="Electric">Electric</option>
                </select>
                <select id="e-trans" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
                    <option value="Manual">Manual</option><option value="Auto">Auto</option>
                </select>
                <input id="e-type" type="text" placeholder="Type (SUV, Truck...)" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
            </div>
            <div class="p-8 bg-slate-50 flex gap-3">
                <button onclick="closeModal('edit-modal')" class="flex-1 py-4 font-black uppercase text-[10px]">Cancel</button>
                <button onclick="saveVehicleChanges()" class="flex-[2] py-4 bg-slate-900 text-white rounded-2xl font-black uppercase text-[10px]">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const client = window.supabase.createClient('https://unaeguquzlvjmiebxsvg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuYWVndXF1emx2am1pZWJ4c3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDk5MTAsImV4cCI6MjA5MTYyNTkxMH0.m6kCJus2-oHlzvmVxfFtbedKPbf8ricpQdIOQeB0fVg');

        let allVehicles = [];
        let activeV = null;
        let maintenanceVehicleId = null;

        async function init() { 
            await loadVehicles(); 
            await loadCustomers(); 
            document.getElementById('b-start-date').valueAsDate = new Date();
        }

        function switchView(v) {
            document.querySelectorAll('.view-content').forEach(e => e.classList.add('hidden'));
            document.getElementById('view-' + v).classList.remove('hidden');
            if(v === 'rentals') loadRentals();
            if(v === 'schedule') renderScheduleGrid();
        }

        async function loadVehicles() {
            const { data } = await client.from('vehicles').select('*');
            allVehicles = data || [];
            renderGrid(allVehicles);
        }

        function renderGrid(list) {
            document.getElementById('vehicle-grid').innerHTML = list.map(v => {
                let sColor = v.status === 'available' ? 'bg-emerald-100 text-emerald-600' : (v.status === 'rented' ? 'bg-rose-100 text-rose-600' : 'bg-amber-100 text-amber-600');
                return `
                <div class="bg-white p-8 rounded-[48px] border border-slate-100 shadow-sm transition-all group hover:shadow-2xl">
                    <div class="flex justify-between items-start mb-4">
                        <span class="px-3 py-1 bg-slate-50 border border-slate-100 rounded-full text-[8px] font-black text-slate-400 uppercase">${v.license_plate}</span>
                        <span class="px-3 py-1 rounded-full text-[8px] font-black uppercase ${sColor}">● ${v.status}</span>
                    </div>
                    <h3 class="text-2xl font-black italic uppercase leading-none mb-4 group-hover:text-blue-600">${v.make_model}</h3>
                    <p class="text-blue-600 font-black text-xl mb-6">$${v.daily_rate}<span class="text-[10px] text-slate-300">/day</span></p>
                    <div class="grid grid-cols-4 gap-2 mb-8 border-y border-slate-50 py-4">
                        <div class="text-center"><p class="text-[7px] text-slate-400 font-black uppercase italic">Seats</p><p class="text-[10px] font-bold">${v.seats || '-'}</p></div>
                        <div class="text-center"><p class="text-[7px] text-slate-400 font-black uppercase italic">Type</p><p class="text-[10px] font-bold truncate">${v.vehicle_type || '-'}</p></div>
                        <div class="text-center"><p class="text-[7px] text-slate-400 font-black uppercase italic">Fuel</p><p class="text-[10px] font-bold">${v.fuel_type || '-'}</p></div>
                        <div class="text-center"><p class="text-[7px] text-slate-400 font-black uppercase italic">Trans</p><p class="text-[10px] font-bold">${v.transmission || '-'}</p></div>
                    </div>
                    <button onclick='openBooking(${JSON.stringify(v)})' ${v.status !== 'available' ? 'disabled' : ''} class="w-full py-5 bg-slate-900 text-white rounded-3xl font-black text-[10px] uppercase mb-3 active:scale-95 disabled:opacity-20">
                        ${v.status === 'available' ? 'Select & Book' : 'Unavailable'}
                    </button>
                    <div class="flex gap-2">
                        <button onclick='openEdit(${JSON.stringify(v)})' class="flex-1 py-3 bg-slate-50 text-slate-400 rounded-2xl font-black text-[8px] uppercase hover:bg-blue-50">Edit</button>
                        <button onclick="toggleMaintenance('${v.id}', '${v.status}')" class="flex-1 py-3 bg-slate-50 text-slate-400 rounded-2xl font-black text-[8px] uppercase hover:bg-amber-50">
                            ${v.status === 'maintenance' ? 'Set Ready' : 'Repair'}
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function filterVehicles() {
            const q = document.getElementById('search-input').value.toLowerCase();
            renderGrid(allVehicles.filter(v => v.make_model.toLowerCase().includes(q) || v.license_plate.toLowerCase().includes(q)));
        }

        // --- MISSING BOOKING LOGIC RESTORED ---
        async function openBooking(v) {
            activeV = v;
            document.getElementById('b-title').innerText = v.make_model;
            document.getElementById('b-subtitle').innerText = `Plate: ${v.license_plate} | $${v.daily_rate}/day`;
            document.getElementById('b-start-date').valueAsDate = new Date();
            updateBookingTotal();
            document.getElementById('booking-modal').classList.add('active');
        }

        function toggleNewCust() { document.getElementById('new-cust-box').classList.toggle('hidden'); }

        async function saveNewCustomer() {
            const name = document.getElementById('nc-name').value;
            const phone = document.getElementById('nc-phone').value;
            if(!name || !phone) return alert("Please fill Name and Phone");
            
            const { data, error } = await client.from('customers').insert([{ full_name: name, phone: phone }]).select().single();
            if(!error) {
                await loadCustomers();
                document.getElementById('b-customer').value = data.id;
                toggleNewCust();
                document.getElementById('nc-name').value = "";
                document.getElementById('nc-phone').value = "";
            } else alert(error.message);
        }

        function updateBookingTotal() {
            const days = parseInt(document.getElementById('b-days').value) || 0;
            document.getElementById('b-total').innerText = `$${days * (activeV?.daily_rate || 0)}`;
        }

        async function confirmRental() {
            const cid = document.getElementById('b-customer').value;
            const days = parseInt(document.getElementById('b-days').value);
            const start = document.getElementById('b-start-date').value;
            if(!cid || !start || days < 1) return alert("Select Customer, Date and Duration");
            
            const { error } = await client.from('rentals').insert([{ 
                vehicle_id: activeV.id, 
                customer_id: cid, 
                start_date: start, 
                rental_days: days, 
                total_price: days * activeV.daily_rate, 
                status: 'active' 
            }]);
            
            if(!error) {
                await client.from('vehicles').update({ status: 'rented' }).eq('id', activeV.id);
                closeModal('booking-modal'); 
                loadVehicles();
                alert("Booking Confirmed!");
            } else alert(error.message);
        }

        // --- PROFESSIONAL RECEIPT DESIGN ---
        function printReceipt(r) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Header Center
            doc.setFontSize(22);
            doc.setFont("helvetica", "bold");
            doc.text("FLEET OS RENTALS", 105, 20, { align: "center" });

            // Address Left, QR Box Right
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("123 Business Avenue\nVientiane, Laos\nContact: +856 20 5555 5555", 15, 30);
            
            // QR Placeholder (Rectangle)
            doc.setDrawColor(0);
            doc.rect(160, 25, 30, 30); 
            doc.setFontSize(8);
            doc.text("SCAN INVOICE", 160, 58);
            
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.text(`INVOICE: ${r.id.substring(0,8).toUpperCase()}`, 195, 20, { align: "right" });

            // Horizontal Line
            doc.setLineWidth(0.5);
            doc.line(15, 65, 195, 65);

            // Information Grid
            doc.setFontSize(10);
            doc.text("CUSTOMER INFORMATION", 15, 75);
            doc.setFont("helvetica", "normal");
            doc.text(`Name: ${r.customers?.full_name}\nPhone: ${r.customers?.phone}\nID: ${r.customers?.passport_number || 'N/A'}`, 15, 82);

            doc.setFont("helvetica", "bold");
            doc.text("VEHICLE INFORMATION", 110, 75);
            doc.setFont("helvetica", "normal");
            doc.text(`Model: ${r.vehicles?.make_model}\nPlate: ${r.vehicles?.license_plate}\nFuel: ${r.vehicles?.fuel_type}`, 110, 82);

            // Table
            doc.autoTable({
                startY: 105,
                head: [['Description for vehicle rented', 'Period for rented period', 'Days', 'Amount']],
                body: [[
                    `${r.vehicles?.make_model}`,
                    `${r.start_date}`,
                    `${r.rental_days}`,
                    `$${r.total_price.toFixed(2)}`
                ]],
                headStyles: { fillColor: [15, 23, 42] },
                theme: 'grid',
                margin: { left: 15, right: 15 }
            });

            // Total Section
            const finalY = doc.lastAutoTable.finalY + 15;
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text(`TOTAL PAID: $${r.total_price.toFixed(2)}`, 195, finalY, { align: "right" });

            // Footer Signatures
            const footerY = 260;
            doc.setLineWidth(0.2);
            doc.line(15, footerY, 75, footerY); // Authorized
            doc.line(135, footerY, 195, footerY); // Customer
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("Authorized Signature", 15, footerY + 5);
            doc.text("Customer Signature", 135, footerY + 5);

            doc.save(`Receipt_${r.id.substring(0,8)}.pdf`);
        }

        // --- ORIGINAL LOGIC RETAINED FROM BACKUP 2 ---
        async function loadRentals() {
            const { data } = await client.from('rentals').select('*, vehicles(*), customers(*)').order('created_at', { ascending: false });
            document.getElementById('rental-list').innerHTML = (data || []).map(r => `
                <tr>
                    <td class="p-8">
                        <div class="font-black italic uppercase">${r.vehicles?.make_model}</div>
                        <div class="text-[9px] text-slate-400 font-bold">${r.start_date}</div>
                    </td>
                    <td class="p-8 font-bold text-slate-500">${r.customers?.full_name || 'N/A'}</td>
                    <td class="p-8 font-black text-[10px] text-slate-400 uppercase">${r.rental_days} Days</td>
                    <td class="p-8 font-black text-[10px] uppercase ${r.status === 'active' ? 'text-blue-600' : 'text-slate-300'}">${r.status}</td>
                    <td class="p-8 text-right space-x-2">
                        <button onclick='printReceipt(${JSON.stringify(r)})' class="bg-slate-900 text-white px-4 py-2 rounded-xl font-black text-[9px] uppercase shadow-sm">Print</button>
                        ${r.status === 'active' ? `<button onclick="returnVehicle('${r.id}', '${r.vehicle_id}')" class="bg-emerald-500 text-white px-3 py-1 rounded-lg font-black text-[9px] uppercase">Return</button>` : ''}
                        <button onclick="voidRental('${r.id}', '${r.vehicle_id}')" class="text-rose-400 font-black text-[9px] uppercase">Void</button>
                    </td>
                </tr>
            `).join('');
        }

        async function returnVehicle(rid, vid) {
            if(!confirm("Complete Return? Vehicle will be Available.")) return;
            await client.from('rentals').update({ status: 'completed' }).eq('id', rid);
            await client.from('vehicles').update({ status: 'available' }).eq('id', vid);
            loadRentals(); loadVehicles();
        }

        async function voidRental(rid, vid) {
            if(!confirm("Void/Delete record?")) return;
            await client.from('rentals').delete().eq('id', rid);
            await client.from('vehicles').update({ status: 'available' }).eq('id', vid);
            loadRentals(); loadVehicles();
        }

        async function renderScheduleGrid() {
            const container = document.getElementById('timeline-container');
            const { data: vList } = await client.from('vehicles').select('*');
            const { data: rList } = await client.from('rentals').select('*').eq('status', 'active');
            const today = new Date(); today.setHours(0,0,0,0);

            let html = `<div class="flex"><div class="w-40 shrink-0"></div>`;
            for(let i=0; i<14; i++) {
                let d = new Date(today); d.setDate(today.getDate() + i);
                html += `<div class="day-cell text-slate-400 border-none">${d.getDate()}/${d.getMonth()+1}</div>`;
            }
            html += `</div>`;
            vList.forEach(v => {
                html += `<div class="flex items-center"><div class="w-40 shrink-0 p-3 font-black text-[9px] uppercase truncate border-r border-slate-50">${v.make_model}</div>`;
                for(let i=0; i<14; i++) {
                    let checkDate = new Date(today); checkDate.setDate(today.getDate() + i);
                    let isRented = rList.some(r => {
                        let start = new Date(r.start_date); start.setHours(0,0,0,0);
                        let end = new Date(start); end.setDate(start.getDate() + r.rental_days);
                        return r.vehicle_id === v.id && checkDate >= start && checkDate < end;
                    });
                    html += `<div class="day-cell ${isRented ? 'rented-cell' : 'bg-slate-50/50'}"></div>`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        async function loadCustomers() {
            const { data } = await client.from('customers').select('*');
            document.getElementById('b-customer').innerHTML = (data || []).map(c => `<option value="${c.id}">${c.full_name}</option>`).join('');
        }

        function openEdit(v) {
            activeV = v;
            document.getElementById('e-model').value = v.make_model;
            document.getElementById('e-plate').value = v.license_plate;
            document.getElementById('e-rate').value = v.daily_rate;
            document.getElementById('e-seats').value = v.seats;
            document.getElementById('e-fuel').value = v.fuel_type;
            document.getElementById('e-trans').value = v.transmission;
            document.getElementById('e-type').value = v.vehicle_type;
            document.getElementById('edit-modal').classList.add('active');
        }

        async function saveVehicleChanges() {
            const updates = {
                make_model: document.getElementById('e-model').value, license_plate: document.getElementById('e-plate').value,
                daily_rate: parseFloat(document.getElementById('e-rate').value), seats: parseInt(document.getElementById('e-seats').value),
                fuel_type: document.getElementById('e-fuel').value, transmission: document.getElementById('e-trans').value, vehicle_type: document.getElementById('e-type').value
            };
            await client.from('vehicles').update(updates).eq('id', activeV.id);
            closeModal('edit-modal'); loadVehicles();
        }

        async function toggleMaintenance(id, cur) {
            if (cur === 'maintenance') { maintenanceVehicleId = id; document.getElementById('repair-modal').classList.add('active'); }
            else { await client.from('vehicles').update({ status: 'maintenance' }).eq('id', id); loadVehicles(); }
        }

        async function submitRepairLog() {
            const desc = document.getElementById('r-description').value;
            const cost = document.getElementById('r-cost').value;
            await client.from('maintenance_logs').insert([{ vehicle_id: maintenanceVehicleId, description: desc, cost: cost, is_resolved: true }]);
            await client.from('vehicles').update({ status: 'available' }).eq('id', maintenanceVehicleId);
            closeModal('repair-modal'); loadVehicles();
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = init;
    </script>
</body>
</html>
