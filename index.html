<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet OS v1.0 | Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap');
        body { font-family: 'Noto Sans Lao', sans-serif; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 50; padding: 20px; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        .view-content.hidden { display: none; }
        .badge { font-size: 8px; font-weight: 900; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="max-w-7xl mx-auto p-4 md:p-6">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tighter">🚀 FLEET OS</h1>
                <p id="db-status" class="text-[10px] text-red-500 font-black uppercase tracking-widest">System Offline</p>
            </div>
            <div class="flex gap-2 mt-4 md:mt-0">
                <button onclick="switchView('dashboard')" class="px-5 py-2 rounded-2xl text-xs font-black bg-slate-100 hover:bg-slate-900 hover:text-white transition-all uppercase">Dashboard</button>
                <button onclick="switchView('rentals')" class="px-5 py-2 rounded-2xl text-xs font-black bg-slate-100 hover:bg-slate-900 hover:text-white transition-all uppercase">Rentals</button>
            </div>
        </header>

        <div id="view-dashboard" class="view-content">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2">
                    <div id="vehicle-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-10 text-slate-400 font-bold">Connecting to Database...</div>
                    </div>
                </div>
                
                <div class="bg-white p-8 rounded-[40px] border border-slate-200 shadow-xl h-fit">
                    <h2 class="text-xl font-black mb-6 uppercase italic text-slate-400 text-center">Registration</h2>
                    <div class="flex flex-col gap-3">
                        <input id="cust-full-name" type="text" placeholder="Full Name" class="w-full bg-slate-50 p-4 rounded-2xl font-bold outline-none border border-slate-100">
                        <input id="cust-phone" type="text" placeholder="Phone Number" class="w-full bg-slate-50 p-4 rounded-2xl font-bold outline-none border border-slate-100">
                        <input id="cust-passport" type="text" placeholder="Passport No." class="w-full bg-slate-50 p-4 rounded-2xl font-bold outline-none border border-slate-100">
                    </div>
                    <button onclick="handleCreateCustomer()" id="reg-btn" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl uppercase text-xs tracking-widest mt-4 shadow-lg hover:bg-blue-600 transition-all">Register & Select</button>
                    
                    <div id="selected-customer-display" class="hidden mt-6 pt-6 border-t border-dashed border-slate-200">
                        <p class="text-[9px] font-black text-blue-600 uppercase mb-1">Active Client</p>
                        <p id="display-name" class="text-lg font-black text-slate-900"></p>
                        <input type="hidden" id="selected-customer-id">
                    </div>
                </div>
            </div>
        </div>

        <div id="view-rentals" class="view-content hidden">
            <div class="bg-white rounded-[32px] border border-slate-200 overflow-hidden shadow-sm">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-[10px] font-black uppercase text-slate-400">
                        <tr><th class="p-6">Vehicle</th><th class="p-6">Customer</th><th class="p-6">Duration</th><th class="p-6">Total Price</th></tr>
                    </thead>
                    <tbody id="rental-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="booking-modal" class="modal">
        <div class="bg-white w-full max-w-md p-8 rounded-[40px] shadow-2xl relative">
            <h2 id="modal-vehicle-info" class="text-2xl font-black italic mb-2 uppercase"></h2>
            <p id="modal-daily-rate" class="text-blue-600 font-bold text-sm mb-6"></p>
            
            <div class="bg-slate-50 p-6 rounded-3xl mb-6">
                <label class="text-[10px] font-black uppercase text-slate-400 block mb-3 text-center">Rental Days</label>
                <div class="flex items-center justify-between gap-4">
                    <button onclick="adjustDays(-1)" class="w-12 h-12 bg-white border border-slate-200 rounded-full font-black text-xl hover:bg-slate-900 hover:text-white transition-all">-</button>
                    <input id="rental-days" type="number" value="1" min="1" oninput="calculateTotal()" class="flex-1 bg-transparent text-center text-4xl font-black outline-none">
                    <button onclick="adjustDays(1)" class="w-12 h-12 bg-white border border-slate-200 rounded-full font-black text-xl hover:bg-slate-900 hover:text-white transition-all">+</button>
                </div>
            </div>

            <div class="flex justify-between items-center px-4 mb-8">
                <span class="text-slate-400 font-black uppercase text-[10px]">Total Amount</span>
                <span id="total-price-display" class="text-2xl font-black text-slate-900">$0.00</span>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-4 rounded-2xl font-black text-slate-400 bg-slate-100 uppercase text-xs">Cancel</button>
                <button onclick="confirmBooking()" class="flex-1 py-4 rounded-2xl font-black bg-slate-900 text-white uppercase text-xs">Confirm Booking</button>
            </div>
        </div>
    </div>

    <script>
        const myFleetAppUrl = 'https://unaeguquzlvjmiebxsvg.supabase.co';
        const myFleetAppKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuYWVndXF1emx2am1pZWJ4c3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDk5MTAsImV4cCI6MjA5MTYyNTkxMH0.m6kCJus2-oHlzvmVxfFtbedKPbf8ricpQdIOQeB0fVg';
        const fleetClient = window.supabase.createClient(myFleetAppUrl, myFleetAppKey);

        let activeVehicle = null;

        function switchView(view) {
            document.querySelectorAll('.view-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + view).classList.remove('hidden');
            if (view === 'rentals') fetchRentals();
        }

        async function loadVehicles() {
            const grid = document.getElementById('vehicle-grid');
            const status = document.getElementById('db-status');
            try {
                const { data, error } = await fleetClient.from('vehicles').select('*');
                if (error) throw error;
                status.innerText = "● System Online";
                status.className = "text-[10px] text-green-500 font-black uppercase tracking-widest";
                
                grid.innerHTML = data.map(v => `
                    <div class="bg-white p-6 rounded-[35px] border border-slate-100 shadow-sm hover:shadow-xl transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <span class="badge ${v.status === 'available' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}">${v.status}</span>
                            <span class="text-[12px] font-black text-blue-600">$${v.daily_rate}/Day</span>
                        </div>
                        <h3 class="text-lg font-black italic uppercase mb-1">${v.make_model}</h3>
                        <p class="text-[9px] text-slate-400 font-bold mb-4 tracking-widest uppercase">${v.license_plate}</p>
                        
                        <div class="grid grid-cols-3 gap-2 mb-6 border-t border-slate-50 pt-4">
                            <div class="text-center">
                                <p class="text-[7px] uppercase text-slate-400 font-black">Type</p>
                                <p class="text-[9px] font-bold">${v.vehicle_type}</p>
                            </div>
                            <div class="text-center border-x border-slate-50">
                                <p class="text-[7px] uppercase text-slate-400 font-black">Fuel</p>
                                <p class="text-[9px] font-bold">${v.fuel_type}</p>
                            </div>
                            <div class="text-center">
                                <p class="text-[7px] uppercase text-slate-400 font-black">Trans</p>
                                <p class="text-[9px] font-bold">${v.transmission}</p>
                            </div>
                        </div>

                        <button onclick='openBooking(${JSON.stringify(v)})' 
                            ${v.status !== 'available' ? 'disabled' : ''}
                            class="w-full py-4 rounded-2xl font-black bg-slate-900 text-white text-[10px] uppercase tracking-widest ${v.status !== 'available' ? 'opacity-20 grayscale' : 'hover:bg-blue-600'} transition-all">
                            ${v.status === 'available' ? 'Select Vehicle' : 'Unavailable'}
                        </button>
                    </div>
                `).join('');
            } catch (e) { status.innerText = "● Offline: " + e.message; }
        }

        async function handleCreateCustomer() {
            const fullName = document.getElementById('cust-full-name').value;
            const phone = document.getElementById('cust-phone').value;
            const passport = document.getElementById('cust-passport').value;
            if (!fullName || !phone) return alert("Required: Name & Phone");

            try {
                const { data, error } = await fleetClient.from('customers').insert([{ 
                    full_name: fullName, 
                    phone: phone,
                    passport_number: passport
                }]).select().single();

                if (error) throw error;
                document.getElementById('selected-customer-id').value = data.id;
                document.getElementById('display-name').innerText = data.full_name;
                document.getElementById('selected-customer-display').classList.remove('hidden');
            } catch (e) { alert("Error: " + e.message); }
        }

        function openBooking(vehicle) {
            if (!document.getElementById('selected-customer-id').value) return alert("Please register/select a customer first!");
            activeVehicle = vehicle;
            document.getElementById('modal-vehicle-info').innerText = vehicle.make_model;
            document.getElementById('modal-daily-rate').innerText = `Daily Rate: $${vehicle.daily_rate}`;
            document.getElementById('rental-days').value = 1;
            calculateTotal();
            document.getElementById('booking-modal').classList.add('active');
        }

        function adjustDays(val) {
            const input = document.getElementById('rental-days');
            let current = parseInt(input.value) + val;
            if (current < 1) current = 1;
            input.value = current;
            calculateTotal();
        }

        function calculateTotal() {
            const days = parseInt(document.getElementById('rental-days').value) || 1;
            const rate = activeVehicle ? activeVehicle.daily_rate : 0;
            document.getElementById('total-price-display').innerText = `$${(days * rate).toFixed(2)}`;
        }

        function closeModal() { document.getElementById('booking-modal').classList.remove('active'); }

        async function confirmBooking() {
            const custId = document.getElementById('selected-customer-id').value;
            const days = parseInt(document.getElementById('rental-days').value);
            try {
                const { error } = await fleetClient.from('rentals').insert([{
                    vehicle_id: activeVehicle.id, 
                    customer_id: custId, 
                    start_date: new Date().toISOString().split('T')[0], 
                    rental_days: days,
                    status: 'active'
                }]);
                if (error) throw error;

                // Mark vehicle as rented in the DB
                await fleetClient.from('vehicles').update({ status: 'rented' }).eq('id', activeVehicle.id);

                alert("Successfully Booked!");
                closeModal();
                loadVehicles();
            } catch (e) { alert(e.message); }
        }

        async function fetchRentals() {
            const list = document.getElementById('rental-list');
            const { data } = await fleetClient.from('rentals').select('*, vehicles(make_model, daily_rate), customers(full_name)');
            list.innerHTML = (data || []).map(r => `
                <tr class="border-b">
                    <td class="p-6 font-bold uppercase italic">${r.vehicles?.make_model || 'N/A'}</td>
                    <td class="p-6">${r.customers?.full_name || 'N/A'}</td>
                    <td class="p-6">${r.rental_days} Days</td>
                    <td class="p-6 font-black text-blue-600">$${(r.rental_days * (r.vehicles?.daily_rate || 0)).toFixed(2)}</td>
                </tr>
            `).join('');
        }

        window.onload = loadVehicles;
    </script>
</body>
</html>
