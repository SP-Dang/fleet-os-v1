<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet OS | Professional Fleet Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf-autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap');
        body { font-family: 'Noto Sans Lao', sans-serif; background: #F8FAFC; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); align-items: center; justify-content: center; z-index: 50; padding: 20px; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .view-content.hidden { display: none; }
        .rented-cell { background: #dbeafe; color: #2563eb; border-radius: 4px; border: 2px solid #fff; }
        .day-cell { min-width: 40px; height: 40px; border: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="max-w-7xl mx-auto p-6">
        <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-[32px] shadow-sm border border-slate-100">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-slate-900 rounded-2xl flex items-center justify-center text-white text-xl">🚀</div>
                <h1 class="text-xl font-black uppercase tracking-tighter">Fleet<span class="text-blue-600">OS</span></h1>
            </div>
            <nav class="flex bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                <button onclick="switchView('dashboard')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all hover:bg-white">Fleet</button>
                <button onclick="switchView('rentals')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all hover:bg-white">Rent History</button>
                <button onclick="switchView('schedule')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all hover:bg-white">14-Day Grid</button>
            </nav>
        </header>

        <div id="view-dashboard" class="view-content">
            <div id="vehicle-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="view-rentals" class="view-content hidden">
            <div class="bg-white rounded-[40px] border border-slate-100 overflow-hidden shadow-sm">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-100 text-[10px] font-black uppercase text-slate-400">
                        <tr>
                            <th class="p-8">Vehicle & Date</th>
                            <th class="p-8">Customer</th>
                            <th class="p-8">Status</th>
                            <th class="p-8">Total</th>
                            <th class="p-8 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rental-list" class="divide-y divide-slate-50 text-sm"></tbody>
                </table>
            </div>
        </div>

        <div id="view-schedule" class="view-content hidden">
            <div class="bg-white rounded-[40px] border border-slate-100 p-8 shadow-sm">
                <h2 class="text-xl font-black mb-6">Availability Timeline</h2>
                <div id="timeline-container" class="overflow-x-auto"></div>
            </div>
        </div>
    </div>

    <div id="repair-modal" class="modal">
        <div class="bg-white w-full max-w-md rounded-[48px] shadow-2xl overflow-hidden relative flex flex-col">
            <div class="bg-amber-500 p-8 text-white"><h2 class="text-2xl font-black uppercase italic">Repair Summary</h2></div>
            <div class="p-8 space-y-4">
                <textarea id="r-description" placeholder="Description of Work" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none h-24"></textarea>
                <input id="r-cost" type="number" placeholder="Cost ($)" class="w-full bg-slate-50 p-4 rounded-2xl font-bold border border-slate-100 outline-none">
            </div>
            <div class="p-8 bg-slate-50 flex gap-3">
                <button onclick="closeModal('repair-modal')" class="flex-1 py-4 font-black uppercase text-[10px]">Cancel</button>
                <button onclick="submitRepairLog()" class="flex-[2] py-4 bg-slate-900 text-white rounded-2xl font-black uppercase text-[10px]">Save & Set Ready</button>
            </div>
        </div>
    </div>

    <div id="booking-modal" class="modal">
        <button onclick="closeModal('booking-modal')" class="p-4 text-white">Close</button>
    </div>

    <script>
        const { createClient } = window.supabase;
        const fleetClient = createClient('https://unaeguquzlvjmiebxsvg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuYWVndXF1emx2am1pZWJ4c3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDk5MTAsImV4cCI6MjA5MTYyNTkxMH0.m6kCJus2-oHlzvmVxfFtbedKPbf8ricpQdIOQeB0fVg');

        let activeV = null;

        async function init() { loadVehicles(); }

        function switchView(v) {
            document.querySelectorAll('.view-content').forEach(e => e.classList.add('hidden'));
            document.getElementById('view-' + v).classList.remove('hidden');
            if(v === 'rentals') loadRentals();
            if(v === 'schedule') renderScheduleGrid();
        }

        // --- CORE FUNCTIONS ---

        async function loadVehicles() {
            const { data } = await fleetClient.from('vehicles').select('*');
            document.getElementById('vehicle-grid').innerHTML = (data || []).map(v => `
                <div class="bg-white p-8 rounded-[40px] border border-slate-100 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <span class="px-3 py-1 bg-slate-100 rounded-full text-[8px] font-black uppercase">${v.license_plate}</span>
                        <span class="text-[8px] font-black uppercase ${v.status === 'available' ? 'text-emerald-500' : 'text-rose-500'}">● ${v.status}</span>
                    </div>
                    <h3 class="text-xl font-black uppercase mb-4 italic">${v.make_model}</h3>
                    <button onclick='openBooking(${JSON.stringify(v)})' ${v.status !== 'available' ? 'disabled' : ''} class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black text-[10px] uppercase disabled:opacity-20">
                        ${v.status === 'available' ? 'Select & Book' : 'Unavailable'}
                    </button>
                    <div class="flex gap-2 mt-2">
                        <button onclick="toggleMaintenance('${v.id}', '${v.status}')" class="flex-1 py-2 bg-slate-50 text-[8px] font-black uppercase rounded-lg">Maintenance</button>
                    </div>
                </div>
            `).join('');
        }

        async function loadRentals() {
            const { data } = await fleetClient.from('rentals').select('*, vehicles(*), customers(*)').order('created_at', { ascending: false });
            document.getElementById('rental-list').innerHTML = (data || []).map(r => `
                <tr>
                    <td class="p-8">
                        <div class="font-black italic uppercase">${r.vehicles?.make_model}</div>
                        <div class="text-[10px] text-slate-400 font-bold">${r.start_date} (${r.rental_days} Days)</div>
                    </td>
                    <td class="p-8 font-bold text-slate-600">${r.customers?.full_name || 'Walk-in'}</td>
                    <td class="p-8">
                        <span class="px-3 py-1 rounded-full text-[8px] font-black uppercase ${r.status === 'active' ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-400'}">${r.status}</span>
                    </td>
                    <td class="p-8 font-black text-blue-600">$${r.total_price}</td>
                    <td class="p-8 text-right space-x-2">
                        <button onclick='printReceipt(${JSON.stringify(r)})' class="text-blue-500 hover:underline font-black text-[9px] uppercase">Receipt</button>
                        ${r.status === 'active' ? `<button onclick="returnVehicle('${r.id}', '${r.vehicle_id}')" class="px-4 py-2 bg-emerald-500 text-white rounded-xl text-[9px] font-black uppercase">Return</button>` : ''}
                        <button onclick="voidRental('${r.id}', '${r.vehicle_id}')" class="text-rose-400 hover:text-rose-600 font-black text-[9px] uppercase">Void</button>
                    </td>
                </tr>
            `).join('');
        }

        async function returnVehicle(rid, vid) {
            if(!confirm("Complete this return? Car will become Available.")) return;
            await fleetClient.from('rentals').update({ status: 'completed', end_date: new Date().toISOString() }).eq('id', rid);
            await fleetClient.from('vehicles').update({ status: 'available' }).eq('id', vid);
            loadRentals();
        }

        async function voidRental(rid, vid) {
            if(!confirm("VOID: This will delete the record and reset vehicle. Continue?")) return;
            await fleetClient.from('rentals').delete().eq('id', rid);
            await fleetClient.from('vehicles').update({ status: 'available' }).eq('id', vid);
            loadRentals();
        }

        // --- RECEIPT GENERATOR ---
        function printReceipt(r) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Header
            doc.setFontSize(22); doc.setFont("helvetica", "bold"); doc.text("ABC RENTALS", 105, 20, { align: "center" });
            doc.setFontSize(10); doc.setFont("helvetica", "normal"); doc.text("123 Business Avenue, Vientiane, Laos", 105, 26, { align: "center" });
            doc.text("Contact: +856 20 XXXX XXXX", 105, 31, { align: "center" });

            // Customer Box
            doc.line(15, 40, 195, 40);
            doc.setFontSize(12); doc.setFont("helvetica", "bold"); doc.text("CUSTOMER DETAILS", 15, 48);
            doc.setFontSize(10); doc.setFont("helvetica", "normal");
            doc.text(`Name: ${r.customers?.full_name || 'N/A'}`, 15, 56);
            doc.text(`Phone: ${r.customers?.phone || 'N/A'}`, 15, 62);
            doc.text(`ID/Passport: ${r.customers?.passport_number || 'N/A'}`, 15, 68);

            // Table
            doc.autoTable({
                startY: 75,
                head: [['Description', 'Period', 'Days', 'Amount']],
                body: [[
                    r.vehicles?.make_model,
                    `${r.start_date} to ${r.end_date || 'Ongoing'}`,
                    r.rental_days,
                    `$${r.total_price}.00`
                ]],
                theme: 'striped',
                headStyles: { fillColor: [15, 23, 42] }
            });

            // Specs
            const finalY = doc.lastAutoTable.finalY + 15;
            doc.setFont("helvetica", "bold"); doc.text("VEHICLE SPECIFICATIONS", 15, finalY);
            doc.setFont("helvetica", "normal");
            doc.text(`Plate: ${r.vehicles?.license_plate}`, 15, finalY + 8);
            doc.text(`Fuel: ${r.vehicles?.fuel_type || 'Diesel'}`, 15, finalY + 14);
            doc.text(`Transmission: ${r.vehicles?.transmission || 'Auto'}`, 15, finalY + 20);

            doc.setFontSize(14); doc.text(`TOTAL PAID: $${r.total_price}.00`, 195, finalY + 10, { align: "right" });

            // Signatures
            doc.line(15, 250, 75, 250); doc.text("Authorized Signature", 15, 255);
            doc.line(135, 250, 195, 250); doc.text("Customer Signature", 135, 255);

            doc.save(`Receipt_${r.id.substring(0,8)}.pdf`);
        }

        // [TIMELINE GRID LOGIC FROM PREVIOUS STEP GOES HERE]

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = init;
    </script>
</body>
</html>
