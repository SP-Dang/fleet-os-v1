<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>GM Login | Fleet OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap');
        body { font-family: 'Noto Sans Lao', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border border-slate-100">
        <div class="flex items-center justify-center mb-6">
            <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white font-black text-xl">
                F
            </div>
        </div>
        <h2 class="text-2xl font-black mb-2 text-center text-slate-900">GM Login</h2>
        <p class="text-xs text-slate-400 text-center mb-8 font-medium">Fleet Management System</p>

        <form id="login-form" onsubmit="event.preventDefault(); login();">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-400 mb-1 tracking-wider">Email</label>
                    <input id="email" type="email" placeholder="you@company.com" autocomplete="email"
                        class="w-full p-3.5 border border-slate-200 rounded-xl text-sm font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-400 mb-1 tracking-wider">Password</label>
                    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"
                        class="w-full p-3.5 border border-slate-200 rounded-xl text-sm font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                <button id="login-btn" type="submit"
                    class="w-full bg-blue-600 text-white p-3.5 rounded-xl font-black text-sm uppercase tracking-wider hover:bg-slate-900 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    Login
                </button>
            </div>
        </form>

        <p id="login-error" class="mt-4 text-xs text-red-500 font-bold text-center hidden"></p>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // =========================================================
        // SECURITY NOTICE: This anon key is visible to all users.
        // Enable Row Level Security (RLS) on ALL Supabase tables
        // and restrict policies to authenticated users only.
        // =========================================================
        const SUPABASE_URL = 'https://unaeguquzlvjmiebxsvg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuYWVndXF1emx2am1pZWJ4c3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDk5MTAsImV4cCI6MjA5MTYyNTkxMH0.m6kCJus2-oHlzvmVxfFtbedKPbf8ricpQdIOQeB0fVg';

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function login() {
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            errorEl.classList.add('hidden');

            if (!email) {
                errorEl.innerText = "Please enter your email.";
                errorEl.classList.remove('hidden');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorEl.innerText = "Please enter a valid email address.";
                errorEl.classList.remove('hidden');
                return;
            }
            if (!password || password.length < 6) {
                errorEl.innerText = "Password must be at least 6 characters.";
                errorEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Authenticating...";

            try {
                const { data, error } = await client.auth.signInWithPassword({ email, password });

                if (error) {
                    throw error;
                }

                if (data?.user) {
                    window.location.href = "index.html";
                } else {
                    throw new Error("Login succeeded but no user data returned.");
                }
            } catch (err) {
                console.error("Login error:", err);
                errorEl.innerText = err.message || "Login failed. Please try again.";
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Login";
            }
        }
    </script>
</body>
</html>
