<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GM Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

    <!-- 🔐 LOGIN UI -->
    <div class="flex items-center justify-center h-screen">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-80">

            <h2 class="text-xl font-black mb-6 text-center">GM Login</h2>

            <input id="email" placeholder="Email"
                class="w-full p-3 border rounded-xl mb-3">

            <!-- FIX #13: Enter key triggers login from password field -->
            <input id="password" type="password" placeholder="Password"
                class="w-full p-3 border rounded-xl mb-4"
                onkeydown="if(event.key==='Enter') login()">

            <!-- FIX #12: Button disabled during async call to prevent double-submit -->
            <button id="login-btn" onclick="login()"
                class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">
                Login
            </button>

        </div>
    </div>

    <!-- 🔧 SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        const client = supabase.createClient(
            "https://unaeguquzlvjmiebxsvg.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuYWVndXF1emx2am1pZWJ4c3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDk5MTAsImV4cCI6MjA5MTYyNTkxMH0.m6kCJus2-oHlzvmVxfFtbedKPbf8ricpQdIOQeB0fVg"
        );

        async function login() {
            const btn = document.getElementById('login-btn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Please enter email and password.");
                return;
            }

            // FIX #12: Disable button during request to prevent double-submit
            btn.disabled = true;
            btn.innerText = "Logging in...";

            const { data, error } = await client.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                alert("Login failed: " + error.message);
                btn.disabled = false;
                btn.innerText = "Login";
            } else {
                window.location.href = "index.html";
            }
        }
    </script>

</body>
</html>
